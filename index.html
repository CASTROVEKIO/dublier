<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dublier - Sua Nova Experiência</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            color: #111;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .cta-button {
            background-color: #111;
            color: #fff;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .cta-button:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.95rem;
            color: #777;
            border-top: 1px solid #eaeaea;
        }
        footer a {
            color: #555;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.2s;
        }
        footer a:hover {
            color: #111;
            text-decoration: underline;
        }
        .copyright {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>

    <main>
        <div class="logo">Dublier</div>
        <p class="subtitle">Sua nova experiência de compras está sendo preparada. Estamos ajustando os últimos detalhes para oferecer o melhor para você.</p>
        
        <!-- TROQUE O NÚMERO 5511999999999 ABAIXO PELO SEU WHATSAPP -->
        <a href="https://wa.me/5511999999999" target="_blank" class="cta-button">
            Fale Conosco
        </a>
    </main>

    <footer>
        <a href="/politicas-de-privacidade/">Políticas de Privacidade</a>
        <a href="/termos-de-servico/">Termos de Serviço</a>
        <div class="copyright">&copy; 2026 Dublier. Todos os direitos reservados.</div>
    </footer>

</body>
</html>
